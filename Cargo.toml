[workspace]
members = [
    "crates/use-geology",
    "crates/use-mineral",
    "crates/use-rock",
    "crates/use-stratum",
    "crates/use-formation",
    "crates/use-fault",
    "crates/use-tectonic-plate",
    "crates/use-geologic-time",
    "crates/use-fossil",
    "crates/use-geologic-process",
    "crates/use-sediment",
]
resolver = "3"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
homepage = "https://rustuse.org"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/RustUse/use-geology"
rust-version = "1.95.0"
version = "0.1.0"

[workspace.dependencies]
use-fault = { version = "0.1.0", path = "crates/use-fault" }
use-formation = { version = "0.1.0", path = "crates/use-formation" }
use-fossil = { version = "0.1.0", path = "crates/use-fossil" }
use-geologic-process = { version = "0.1.0", path = "crates/use-geologic-process" }
use-geologic-time = { version = "0.1.0", path = "crates/use-geologic-time" }
use-geology = { version = "0.1.0", path = "crates/use-geology" }
use-mineral = { version = "0.1.0", path = "crates/use-mineral" }
use-rock = { version = "0.1.0", path = "crates/use-rock" }
use-sediment = { version = "0.1.0", path = "crates/use-sediment" }
use-stratum = { version = "0.1.0", path = "crates/use-stratum" }
use-tectonic-plate = { version = "0.1.0", path = "crates/use-tectonic-plate" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-mineral",
    "use-rock",
    "use-stratum",
    "use-formation",
    "use-fault",
    "use-tectonic-plate",
    "use-geologic-time",
    "use-fossil",
    "use-geologic-process",
    "use-sediment",
    "use-geology",
]